<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaScript Basics</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>JavaScript Basics</h1>
    </header>


    

    <section>
        <h2>1. Variables</h2>

        <p>Variables are used to store data.</p>

        <button onclick="showVariables()">
            Run Variables
        </button>

        <p id="variableOutput"></p>
    </section>


   

    <section>
        <h2>2. Data Types</h2>

        <p>
            String, Number, Boolean, Array and Object
        </p>

        <button onclick="showDataTypes()">
            Run Data Types
        </button>

        <p id="dataTypeOutput"></p>
    </section>


    

    <section>
        <h2>3. Operators</h2>

        <button onclick="showOperators()">
            Run Operators
        </button>

        <p id="operatorOutput"></p>
    </section>



    <section>
        <h2>4. Conditions</h2>

        <input
            type="number"
            id="marks"
            placeholder="Enter marks"
        >

        <button onclick="checkResult()">
            Check Result
        </button>

        <p id="conditionOutput"></p>
    </section>


    

    <section>
        <h2>5. Loops</h2>

        <button onclick="showLoop()">
            Run Loop
        </button>

        <p id="loopOutput"></p>
    </section>


   

    <section>
        <h2>6. Functions</h2>

        <input
            type="number"
            id="num1"
            placeholder="Enter number 1"
        >

        <input
            type="number"
            id="num2"
            placeholder="Enter number 2"
        >

        <button onclick="addNumbers()">
            Add Numbers
        </button>

        <p id="functionOutput"></p>
    </section>


    <script src="script.js"></script>

</body>

</html>
